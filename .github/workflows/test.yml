name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests (NeDB, SQLite)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  live:
    name: Live backends (PostgreSQL, MariaDB, MySQL, MongoDB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meshcentral
          POSTGRES_PASSWORD: meshcentral
          POSTGRES_DB: meshcentral
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U meshcentral -d meshcentral"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: meshcentral
          MARIADB_USER: meshcentral
          MARIADB_PASSWORD: meshcentral
        ports: ["33306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meshcentral
          MYSQL_USER: meshcentral
          MYSQL_PASSWORD: meshcentral
        ports: ["33307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongodb:
        image: mongo:6
        ports: ["37017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CS_TEST_POSTGRES: postgres://meshcentral:meshcentral@127.0.0.1:55432/meshcentral
      CS_TEST_MARIADB: mariadb://meshcentral:meshcentral@127.0.0.1:33306/meshcentral
      CS_TEST_MYSQL: mysql://meshcentral:meshcentral@127.0.0.1:33307/meshcentral
      CS_TEST_MONGODB: mongodb://127.0.0.1:37017/meshcentral
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/db_live.test.js
